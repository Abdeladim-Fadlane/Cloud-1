# create volumes for mariadb and wordpress

- name: Create volumes for WordPress and MariaDB
  file:
    path: "{{ ansible_env.HOME }}/data/wordpress"
    state: directory
- name: Create volumes for WordPress and MariaDB
  file:
    path: "{{ ansible_env.HOME }}/data/mariadb"
    state: directory

- name: Copy docker-compose.yml
  copy:
    src:  docker-compose.yml
    dest: "{{ ansible_env.HOME }}/cloud-1/docker-compose.yml"
    mode: '0644'
- name: Copy .env file
  copy:
    src: .env
    dest: "{{ ansible_env.HOME }}/cloud-1/.env"
    mode: '0644'

- name: Run docker-compose
  command: 	docker-compose -f docker-compose.yml up -d --build
  args:
    chdir: "{{ ansible_env.HOME }}/cloud-1"
  
- name: Show info about container deployment
  debug:
    msg:
      - "Docker containers started successfully."
      - "Try to access your site at:"
      - "  https://abouassi.duckdns.org"
      - "  https://garb-anzo.tech"
      - "  https://afadlane.garb-anzo.tech"
      - "You can access phpMyAdmin at: http://127.0.0.1:8080"