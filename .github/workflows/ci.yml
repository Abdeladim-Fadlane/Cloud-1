name: Test Docker Push
on:
  push:
    branches: [ main ]
jobs:
  test-push:
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          
      - name: Test Push Simple Image
        run: |
          echo "FROM alpine:latest" | docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/test:latest -
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/test:latest
          
      - name: Verify Push Success
        run: echo "✅ Successfully pushed test image to Docker Hub!"
