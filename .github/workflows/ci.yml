name: CI & DockerHub Push
on:
  push:
    branches: [ main ]
jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: afadlanee
          password: dckr_pat_IDEwGFnhg-j6XCcabIvN1zK4bMI
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build & Push MariaDB Image
        uses: docker/build-push-action@v5
        with:
          context: ./roles/inception/srcs/requirements/mariadb
          push: true
          tags: afadlane/mariadb:latest
      - name: Build & Push WordPress Image
        uses: docker/build-push-action@v5
        with:
          context: ./roles/inception/srcs/requirements/wordpress
          push: true
          tags: afaldnae/wordpress:latest
      - name: Build & Push NGINX Image
        uses: docker/build-push-action@v5
        with:
          context: ./roles/inception/srcs/requirements/nginx
          push: true
          tags: afadlane/nginx:latest
