
name: Test Docker Push
on:
  push:
    branches: [ main ]
jobs:
  test-push:
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
          
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Build & Push MariaDB Image
        uses: docker/build-push-action@v5
        with:
          context: roles/inception/srcs/requirements/mariadb
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/mariadb:latest
          
      - name: Build & Push WordPress Image
        uses: docker/build-push-action@v5
        with:
          context: roles/inception/srcs/requirements/wordpress
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/wordpress:latest
          
      - name: Build & Push NGINX Image
        uses: docker/build-push-action@v5
        with:
          context: roles/inception/srcs/requirements/nginx
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/nginx:latest